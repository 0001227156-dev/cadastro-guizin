<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eaf4ff, #cfe7ff);
    color: #12355b;
}

.container {
    width: 400px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #1769aa;
    font-size: 28px;
}

label {
    display: block;
    margin-top: 17px;
    font-weight: bold;
    color: #12355b;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #b8c9d9;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #1769aa;
    box-shadow: 0 0 6px rgba(23, 105, 170, 0.3);
}

.botoes {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;
}


.botao {
    flex: 1;
    text-align: center;
    text-decoration: none;
    background: #1769aa;
    color: white;
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.botao:hover {
    background: #0d4f82;
    transform: translateY(-2px);
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
}

input::placeholder {
    color: #8a9aaa;
}
    </style>
</head>

<body>

    <label>Nome:</label>
<input type="text" id="nome" placeholder="Digite seu nome">

<label>E-mail:</label>
<input type="email" id="email" placeholder="Digite seu e-mail">

<label>Senha:</label>
<input type="password" id="senha" placeholder="Digite sua senha">
const senhaOculta = " * ". repita ( senha . valor .comprimento);

<label>Telefone:</label>
<input type="text" placeholder="Digite seu telefone"
       oninput="this.value=this.value.replace(/[^0-9]/g,'')">

<label>Endereço:</label>
<input type="text" id="endereco" placeholder="Rua, número e bairro">

<label>CPF:</label>
<input type="text" id="cpf" maxlength="14" placeholder="Digite seu CPF">

<script>
document.getElementById("cpf").addEventListener("input", function() {
    let cpf = this.value.replace(/\D/g, "");

    cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
    cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
    cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

    this.value = cpf;
});
</script>

<label>Imagem:</label>
<input type="file" id="imagem" accept="image/*">

<div id="preview"></div>

<!-- O JS vai criar o botão aqui -->
<div id="areaBotao"></div>

<script src="script.js"></script>
